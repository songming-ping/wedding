<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>婚礼礼金簿 · 刘松铭 &amp; 蒋萍</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --gold: #b8915c;
    --gold-light: #d4b98a;
    --pink: #f3d9d2;
    --bg: #faf6f0;
    --card: #ffffff;
    --text: #4a3f35;
    --text-light: #9a8b7d;
    --green: #7ba05b;
    --red: #c05a5a;
  }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.5;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .container { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }

  /* 顶部 */
  .header {
    text-align: center;
    padding: 26px 16px 20px;
    background: linear-gradient(160deg, #fdf9f4 0%, #f7ece4 100%);
    border-radius: 18px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: "♥";
    position: absolute;
    font-size: 90px;
    color: rgba(184,145,92,0.08);
    right: -10px;
    top: -20px;
    transform: rotate(15deg);
  }
  .header h1 {
    font-size: 22px;
    letter-spacing: 3px;
    color: var(--gold);
    font-weight: 600;
  }
  .header .names { margin: 8px 0 4px; font-size: 18px; color: var(--text); letter-spacing: 2px; }
  .header .sub { font-size: 13px; color: var(--text-light); letter-spacing: 1px; }

  /* 统计卡 */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin: 14px 0;
  }
  .stat {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 8px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(74,63,53,0.06);
  }
  .stat .num {
    font-size: 20px;
    font-weight: 700;
    color: var(--gold);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stat .lbl { font-size: 12px; color: var(--text-light); margin-top: 3px; }
  .stat.total { background: linear-gradient(160deg, #b8915c, #a37d4a); }
  .stat.total .num, .stat.total .lbl { color: #fff; }

  /* 添加表单 */
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(74,63,53,0.06);
    margin-bottom: 14px;
  }
  .card h2 {
    font-size: 15px;
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card h2::before { content: ""; width: 4px; height: 14px; background: var(--gold); border-radius: 2px; }
  .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .form-row .field { flex: 1; }
  .field label { display: block; font-size: 12px; color: var(--text-light); margin-bottom: 4px; }
  .field input, .field select {
    width: 100%;
    height: 44px;
    border: 1px solid #e8ddd2;
    border-radius: 10px;
    padding: 0 12px;
    font-size: 16px;
    color: var(--text);
    background: #fdfbf8;
    outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--gold-light); background: #fff; }
  .btn {
    display: block;
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 2px;
    cursor: pointer;
  }
  .btn-primary { background: linear-gradient(160deg, #c8a46b, #b8915c); color: #fff; box-shadow: 0 3px 10px rgba(184,145,92,0.3); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-ghost {
    background: #f5efe7; color: var(--gold);
    font-size: 14px; height: 40px; border-radius: 10px;
    width: auto; padding: 0 14px; display: inline-block;
  }

  /* 筛选 */
  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
  .filter-btn {
    flex: 1;
    height: 38px;
    border: 1px solid #e8ddd2;
    border-radius: 20px;
    background: #fff;
    color: var(--text-light);
    font-size: 14px;
    cursor: pointer;
  }
  .filter-btn.active { background: var(--gold); border-color: var(--gold); color: #fff; font-weight: 600; }

  /* 列表 */
  .list-title { font-size: 13px; color: var(--text-light); margin: 4px 2px 10px; }
  .record {
    background: var(--card);
    border-radius: 14px;
    padding: 13px 14px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(74,63,53,0.05);
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }
  .record .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: linear-gradient(160deg, #f6e4da, #f0d5c8);
    color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700;
    flex-shrink: 0;
  }
  .record .info { flex: 1; min-width: 0; }
  .record .name { font-size: 16px; font-weight: 600; }
  .record .meta { font-size: 12px; color: var(--text-light); margin-top: 2px; }
  .record .amount { font-size: 17px; font-weight: 700; color: #b04a4a; white-space: nowrap; }
  .record .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
    vertical-align: 2px;
  }
  .tag-m { background: #eaf1e2; color: #5d7d42; }
  .tag-w { background: #fbeae6; color: #c05a5a; }
  .record .ops { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .record .ops button {
    border: none; background: none;
    font-size: 12px; color: var(--text-light);
    padding: 2px 6px; cursor: pointer;
  }
  .record .ops button.del { color: #c05a5a; }

  /* 同步状态 */
  .sync-status {
    text-align: center;
    font-size: 12px;
    color: var(--text-light);
    padding: 8px;
  }
  .sync-status .ok { color: var(--green); }
  .sync-status .fail { color: var(--red); }
  .sync-status button {
    border: none; background: none; color: var(--gold);
    text-decoration: underline; font-size: 12px; cursor: pointer; padding: 0 4px;
  }

  /* 底部工具 */
  .tools {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* 弹窗 */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff;
    width: 100%;
    max-width: 560px;
    border-radius: 20px 20px 0 0;
    padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height: 82vh;
    overflow-y: auto;
  }
  .modal h3 { font-size: 17px; text-align: center; margin-bottom: 14px; color: var(--text); }
  .modal textarea {
    width: 100%;
    height: 120px;
    border: 1px solid #e8ddd2;
    border-radius: 10px;
    padding: 10px;
    font-size: 13px;
    resize: vertical;
    background: #fdfbf8;
  }
  .modal .btn-row { display: flex; gap: 10px; margin-top: 12px; }
  .modal .btn-row .btn { flex: 1; height: 42px; font-size: 15px; }
  .btn-cancel { background: #f0ebe4; color: var(--text-light); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 80px;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 14px;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    max-width: 80%;
    text-align: center;
  }
  .toast.show { opacity: 1; }

  .empty {
    text-align: center;
    color: var(--text-light);
    padding: 40px 0;
    font-size: 14px;
  }
  .empty .heart { font-size: 30px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="container">

  <!-- 头部 -->
  <div class="header">
    <h1>喜 宴 礼 金 簿</h1>
    <div class="names">刘松铭 &amp; 蒋萍</div>
    <div class="sub">感谢每一位亲友的祝福与心意</div>
  </div>

  <!-- 统计 -->
  <div class="stats">
    <div class="stat total">
      <div class="num" id="statTotal">0</div>
      <div class="lbl">总礼金(元)</div>
    </div>
    <div class="stat">
      <div class="num" id="statCount">0</div>
      <div class="lbl">随礼人数</div>
    </div>
    <div class="stat">
      <div class="num" id="statSplit">0 / 0</div>
      <div class="lbl">男方 / 女方</div>
    </div>
  </div>

  <!-- 添加表单 -->
  <div class="card">
    <h2>记 录 礼 金</h2>
    <div class="form-row">
      <div class="field">
        <label>名字</label>
        <input type="text" id="inpName" placeholder="如：王小明" maxlength="20">
      </div>
      <div class="field">
        <label>礼金（元）</label>
        <input type="number" id="inpAmount" placeholder="如：800" min="0" inputmode="decimal">
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label>关系</label>
        <select id="inpSide">
          <option value="m">男方亲友</option>
          <option value="w">女方亲友</option>
        </select>
      </div>
      <div class="field">
        <label>备注（选填）</label>
        <input type="text" id="inpNote" placeholder="如：同事 / 表姐" maxlength="20">
      </div>
    </div>
    <button class="btn btn-primary" id="btnAdd" onclick="addRecord()">✓ 记 录</button>
  </div>

  <!-- 筛选 + 列表 -->
  <div class="filter-row">
    <button class="filter-btn active" data-f="all" onclick="setFilter('all')">全部</button>
    <button class="filter-btn" data-f="m" onclick="setFilter('m')">男方亲友</button>
    <button class="filter-btn" data-f="w" onclick="setFilter('w')">女方亲友</button>
  </div>
  <div class="list-title" id="listTitle"></div>
  <div id="list"></div>
  <div class="empty" id="emptyTip" style="display:none;">
    <div class="heart">♥</div>
    还没有记录，点击上方「记录礼金」<br>登记第一笔心意吧
  </div>

  <!-- 同步状态 -->
  <div class="sync-status" id="syncStatus"></div>

  <!-- 底部工具 -->
  <div class="tools">
    <button class="btn-ghost" onclick="openShare()">🔗 分享链接</button>
    <button class="btn-ghost" onclick="openExport()">📤 导出备份</button>
    <button class="btn-ghost" onclick="openImport()">📥 导入合并</button>
  </div>

  <div class="sync-status" style="margin-top:20px;font-size:11px;color:#c9beb2;">
    提示：网页会自动云端同步，打开分享链接即可共同记录。<br>请务定期点「导出备份」保存数据。
  </div>
</div>

<!-- 分享弹窗 -->
<div class="modal-mask" id="modalShare">
  <div class="modal">
    <h3>🔗 分享给家人朋友</h3>
    <p style="font-size:13px;color:#9a8b7d;margin-bottom:8px;">把下面的链接发给家人，他们打开就能一起记录和查看（无需登录）。</p>
    <textarea id="shareUrl" readonly style="height:70px;font-size:13px;"></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="copyShareUrl()">复制链接</button>
      <button class="btn btn-cancel" onclick="closeModal('modalShare')">关闭</button>
    </div>
  </div>
</div>

<!-- 导出弹窗 -->
<div class="modal-mask" id="modalExport">
  <div class="modal">
    <h3>📤 导出备份</h3>
    <p style="font-size:13px;color:#9a8b7d;margin-bottom:8px;">复制下方内容保存，或下载为文件。换手机、防丢失用。</p>
    <textarea id="exportText" readonly></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="copyExport()">复制内容</button>
      <button class="btn btn-ghost" style="flex:1;height:42px;font-size:15px;width:auto;" onclick="downloadBackup()">下载文件</button>
      <button class="btn btn-cancel" onclick="closeModal('modalExport')">关闭</button>
    </div>
  </div>
</div>

<!-- 导入弹窗 -->
<div class="modal-mask" id="modalImport">
  <div class="modal">
    <h3>📥 导入合并</h3>
    <p style="font-size:13px;color:#9a8b7d;margin-bottom:8px;">粘贴他人导出的内容，或上传备份文件，会自动合并到本簿（按名字+金额去重）。</p>
    <textarea id="importText" placeholder="粘贴导出的内容..."></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="doImport()">导入合并</button>
      <button class="btn btn-cancel" onclick="closeModal('modalImport')">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ===== 数据模型 =====
  // record: { id, name, amount, side: 'm'|'w', note, ts }
  var DB_KEY = 'giftbook_v1';
  var records = [];
  var currentFilter = 'all';

  // ===== 云端同步（jsonblob 免费匿名存储）=====
  var CLOUD_URL = 'https://jsonblob.com/api/jsonBlob';
  var cloudId = null;      // 云端数据id
  var editingId = null;    // 正在编辑的记录id

  function getParam(name) {
    var m = location.search.match(new RegExp('[?&]' + name + '=([^&]+)'));
    return m ? decodeURIComponent(m[1]) : null;
  }

  function saveLocal() {
    try { localStorage.setItem(DB_KEY, JSON.stringify(records)); } catch (e) {}
  }
  function loadLocal() {
    try {
      var s = localStorage.getItem(DB_KEY);
      if (s) records = JSON.parse(s);
    } catch (e) { records = []; }
    if (!Array.isArray(records)) records = [];
  }

  // 创建云端blob
  function createBlob(data, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open('POST', CLOUD_URL, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 15000;
    xhr.onload = function () {
      var loc = xhr.getResponseHeader('Location');
      var id = loc ? loc.split('/').pop() : null;
      cb(id ? id : null, xhr.status);
    };
    xhr.onerror = function () { cb(null, 0); };
    xhr.ontimeout = function () { cb(null, 0); };
    xhr.send(JSON.stringify(data));
  }

  // 读取云端blob
  function fetchBlob(id, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', CLOUD_URL + '/' + id, true);
    xhr.timeout = 15000;
    xhr.onload = function () {
      if (xhr.status === 200) {
        try { cb(JSON.parse(xhr.responseText), true); }
        catch (e) { cb(null, false); }
      } else {
        cb(null, false);
      }
    };
    xhr.onerror = function () { cb(null, false); };
    xhr.ontimeout = function () { cb(null, false); };
    xhr.send();
  }

  // 更新云端blob
  function updateBlob(id, data, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open('PUT', CLOUD_URL + '/' + id, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 15000;
    xhr.onload = function () { cb && cb(xhr.status === 200 || xhr.status === 201); };
    xhr.onerror = function () { cb && cb(false); };
    xhr.ontimeout = function () { cb && cb(false); };
    xhr.send(JSON.stringify(data));
  }

  // 云端同步状态
  var syncing = false;
  function setSync(text, cls) {
    var el = document.getElementById('syncStatus');
    el.innerHTML = text;
    el.className = 'sync-status' + (cls ? ' ' + cls : '');
  }

  // 推送本地数据到云端（去重合并策略：以本地为主，云端为辅）
  function pushCloud() {
    if (syncing || !cloudId) return;
    syncing = true;
    setSync('正在同步到云端…');
    updateBlob(cloudId, records, function (ok) {
      syncing = false;
      if (ok) {
        setSync('✓ 已同步到云端，家人打开即可看到最新记录', 'ok');
      } else {
        setSync('⚠ 云端暂不可用，记录已安全保存在本机。可稍后点击重试，或使用「导出备份」', 'fail');
      }
    });
  }

  // 拉取云端数据（进入时调用；若云端有新数据则合并）
  function pullCloud(first) {
    if (!cloudId) { renderAll(); return; }
    fetchBlob(cloudId, function (cloudData, ok) {
      if (ok && Array.isArray(cloudData) && cloudData.length) {
        // 合并：以本地为基准追加云端中本地没有的（按 id 去重）
        var localIds = {};
        records.forEach(function (r) { localIds[r.id] = 1; });
        var merged = false;
        cloudData.forEach(function (cr) {
          if (cr && cr.id && !localIds[cr.id]) {
            records.push(cr);
            localIds[cr.id] = 1;
            merged = true;
          }
        });
        if (merged) {
          records.sort(function (a, b) { return b.ts - a.ts; });
          saveLocal();
          setSync('✓ 已合并云端最新数据', 'ok');
        } else if (first) {
          setSync('✓ 已连接云端，打开即共享', 'ok');
        }
      } else if (first) {
        setSync('⚠ 云端暂不可用，当前为本机模式（可正常记录，稍后会自动重试同步）', 'fail');
      }
      renderAll();
      // 本地有而云端可能没有时，回推一次
      if (records.length) pushCloud();
    });
  }

  // ===== 初始化 =====
  function init() {
    loadLocal();
    var urlId = getParam('id');
    var savedId = null;
    try { savedId = localStorage.getItem('giftbook_cid'); } catch (e) {}

    if (urlId && /^[A-Za-z0-9]{8,}$/.test(urlId)) {
      cloudId = urlId;
      try { localStorage.setItem('giftbook_cid', urlId); } catch (e) {}
      pullCloud(true);
    } else if (savedId && /^[A-Za-z0-9]{8,}$/.test(savedId)) {
      cloudId = savedId;
      pullCloud(true);
    } else {
      // 首次使用：创建云端空间
      setSync('正在创建共享空间…');
      createBlob(records, function (id, status) {
        if (id) {
          cloudId = id;
          try { localStorage.setItem('giftbook_cid', id); } catch (e) {}
          setSync('✓ 共享空间已创建！请点击下方「分享链接」发给家人', 'ok');
        } else {
          setSync('⚠ 云端暂不可用，当前为本机模式。可正常记录，稍后会自动重试', 'fail');
        }
        renderAll();
      });
    }
    renderAll();
  }

  // ===== 渲染 =====
  function fmtMoney(n) {
    n = Number(n) || 0;
    return n.toLocaleString('zh-CN');
  }

  function renderStats() {
    var total = 0, cnt = 0, m = 0, w = 0;
    records.forEach(function (r) {
      total += Number(r.amount) || 0;
      cnt++;
      if (r.side === 'm') m++; else w++;
    });
    document.getElementById('statTotal').textContent = fmtMoney(total);
    document.getElementById('statCount').textContent = cnt;
    document.getElementById('statSplit').textContent = m + ' / ' + w;
  }

  function renderList() {
    var list = document.getElementById('list');
    var empty = document.getElementById('emptyTip');
    var filtered = records.filter(function (r) {
      if (currentFilter === 'all') return true;
      return r.side === currentFilter;
    });
    document.getElementById('listTitle').textContent =
      '共 ' + filtered.length + ' 条记录' + (currentFilter !== 'all' ? '（' + (currentFilter === 'm' ? '男方亲友' : '女方亲友') + '）' : '');

    if (!filtered.length) {
      list.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    var html = '';
    filtered.forEach(function (r) {
      var initial = (r.name || '?').charAt(0);
      var tag = r.side === 'm' ? '<span class="tag tag-m">男方</span>' : '<span class="tag tag-w">女方</span>';
      var note = r.note ? '<span class="meta">' + esc(r.note) + ' · ' + fmtTime(r.ts) + '</span>'
                        : '<span class="meta">' + fmtTime(r.ts) + '</span>';
      html += '<div class="record">' +
        '<div class="avatar">' + esc(initial) + '</div>' +
        '<div class="info"><div class="name">' + esc(r.name) + tag + '</div>' + note + '</div>' +
        '<div class="amount">¥' + fmtMoney(r.amount) + '</div>' +
        '<div class="ops">' +
          '<button onclick="editRecord(\'' + r.id + '\')">改</button>' +
          '<button class="del" onclick="delRecord(\'' + r.id + '\')">删</button>' +
        '</div>' +
      '</div>';
    });
    list.innerHTML = html;
  }

  function renderAll() {
    renderStats();
    renderList();
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    var p = function (n) { return n < 10 ? '0' + n : n; };
    return (d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  // ===== 操作 =====
  function uid() {
    return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  window.addRecord = function () {
    var name = document.getElementById('inpName').value.trim();
    var amount = document.getElementById('inpAmount').value.trim();
    var side = document.getElementById('inpSide').value;
    var note = document.getElementById('inpNote').value.trim();

    if (!name) { toast('请填写名字'); return; }
    if (amount === '' || isNaN(Number(amount)) || Number(amount) <= 0) { toast('请填写正确的礼金金额'); return; }

    if (editingId) {
      // 更新
      for (var i = 0; i < records.length; i++) {
        if (records[i].id === editingId) {
          records[i].name = name;
          records[i].amount = Number(amount);
          records[i].side = side;
          records[i].note = note;
          records[i].ts = Date.now();
          break;
        }
      }
      editingId = null;
      document.getElementById('btnAdd').textContent = '✓ 记 录';
      toast('已修改');
    } else {
      records.push({ id: uid(), name: name, amount: Number(amount), side: side, note: note, ts: Date.now() });
      toast('✓ 已记录 ' + name + ' 的礼金');
    }

    document.getElementById('inpName').value = '';
    document.getElementById('inpAmount').value = '';
    document.getElementById('inpNote').value = '';
    saveLocal();
    renderAll();
    pushCloud();
  };

  window.editRecord = function (id) {
    for (var i = 0; i < records.length; i++) {
      if (records[i].id === id) {
        var r = records[i];
        document.getElementById('inpName').value = r.name;
        document.getElementById('inpAmount').value = r.amount;
        document.getElementById('inpSide').value = r.side;
        document.getElementById('inpNote').value = r.note || '';
        editingId = id;
        document.getElementById('btnAdd').textContent = '✓ 保存修改';
        toast('正在编辑：' + r.name + '，改完点「保存修改」');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
    }
  };

  window.delRecord = function (id) {
    if (!confirm('确定删除这条记录吗？')) return;
    records = records.filter(function (r) { return r.id !== id; });
    saveLocal();
    renderAll();
    pushCloud();
    toast('已删除');
  };

  window.setFilter = function (f) {
    currentFilter = f;
    var btns = document.querySelectorAll('.filter-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].className = 'filter-btn' + (btns[i].getAttribute('data-f') === f ? ' active' : '');
    }
    renderList();
  };

  // ===== 分享 =====
  window.openShare = function () {
    if (!cloudId) { toast('共享空间还未创建成功，请稍后重试'); return; }
    var url = location.origin + location.pathname + '?id=' + cloudId;
    document.getElementById('shareUrl').value = url;
    showModal('modalShare');
  };
  window.copyShareUrl = function () {
    var ta = document.getElementById('shareUrl');
    ta.select();
    try { document.execCommand('copy'); toast('✓ 链接已复制，发到微信即可'); }
    catch (e) { toast('请长按链接手动复制'); }
  };

  // ===== 导出 =====
  window.openExport = function () {
    var lines = [];
    lines.push('婚礼礼金簿 · 刘松铭 & 蒋萍');
    lines.push('导出时间：' + new Date().toLocaleString());
    lines.push('共 ' + records.length + ' 条，总额 ¥' + fmtMoney(records.reduce(function (s, r) { return s + (Number(r.amount) || 0); }, 0)));
    lines.push('--------------------------------');
    lines.push('名字\t金额(元)\t关系\t备注\t时间');
    records.slice().sort(function (a, b) { return b.ts - a.ts; }).forEach(function (r) {
      lines.push([r.name, r.amount, r.side === 'm' ? '男方亲友' : '女方亲友', r.note || '', fmtTime(r.ts)].join('\t'));
    });
    lines.push('--------------------------------');
    lines.push('【数据备份码】' + btoa(unescape(encodeURIComponent(JSON.stringify(records)))));
    document.getElementById('exportText').value = lines.join('\n');
    showModal('modalExport');
  };
  window.copyExport = function () {
    var ta = document.getElementById('exportText');
    ta.select();
    try { document.execCommand('copy'); toast('✓ 备份内容已复制'); }
    catch (e) { toast('请长按内容手动复制'); }
  };
  window.downloadBackup = function () {
    var blob = new Blob([document.getElementById('exportText').value], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '婚礼礼金簿备份_' + new Date().toISOString().slice(0, 10) + '.txt';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('✓ 备份文件已下载');
  };

  // ===== 导入 =====
  window.openImport = function () { showModal('modalImport'); };
  window.doImport = function () {
    var text = document.getElementById('importText').value.trim();
    if (!text) { toast('请先粘贴内容'); return; }
    var imported = 0;
    // 尝试解析备份码
    var m = text.match(/【数据备份码】(\S+)/);
    var data = null;
    if (m) {
      try { data = JSON.parse(decodeURIComponent(escape(atob(m[1])))); } catch (e) { data = null; }
    }
    if (!data) {
      // 尝试直接 JSON
      try { data = JSON.parse(text); } catch (e) { data = null; }
    }
    if (!Array.isArray(data)) { toast('无法识别内容，请导出方重新导出后再导入'); return; }

    var exist = {};
    records.forEach(function (r) { exist[r.id] = 1; });
    var nameAmt = {};
    records.forEach(function (r) { nameAmt[r.name + '_' + r.amount] = 1; });

    data.forEach(function (r) {
      if (!r || !r.id) return;
      if (!exist[r.id] && !nameAmt[r.name + '_' + r.amount]) {
        records.push(r);
        exist[r.id] = 1;
        nameAmt[r.name + '_' + r.amount] = 1;
        imported++;
      }
    });
    if (imported) {
      records.sort(function (a, b) { return b.ts - a.ts; });
      saveLocal();
      renderAll();
      pushCloud();
      toast('✓ 成功导入合并 ' + imported + ' 条');
    } else {
      toast('没有新记录可导入（都已存在）');
    }
    document.getElementById('importText').value = '';
    closeModal('modalImport');
  };

  // ===== 弹窗 & toast =====
  function showModal(id) { document.getElementById(id).classList.add('show'); }
  window.closeModal = function (id) { document.getElementById(id).classList.remove('show'); };
  document.querySelectorAll('.modal-mask').forEach(function (mask) {
    mask.addEventListener('click', function (e) {
      if (e.target === mask) mask.classList.remove('show');
    });
  });

  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  // 定期自动重试同步
  setInterval(function () {
    if (records.length && cloudId && !syncing) pushCloud();
  }, 60000);

  init();
})();
</script>
</body>
</html>
